name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only needs to read the repository.
permissions:
  contents: read

# Cancel superseded PR runs, but never cancel a run on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# NOTE: both job `name:` values below are required status checks in the branch protection
# on `main`. If you rename a job, update branch protection in the same change, or every PR
# will wait forever for a check that no longer reports.
jobs:
  quality-gate:
    name: Lint, test and build (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Empty on forks and until the secret is added; the Sonar step is skipped then.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # full history lets SonarQube Cloud attribute new code correctly
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      # Lifecycle scripts of dependencies are not run (SonarCloud S6505).
      # The Prisma client is generated explicitly in the next step instead.
      - name: Install dependencies (no install scripts)
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Typecheck, lint, tests with coverage gate, schema and submission guard
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build the app
        run: npm run build

      # CI-based analysis uploads the coverage report (coverage/lcov.info) to SonarQube Cloud.
      # Requires: SONAR_TOKEN repository secret AND Automatic Analysis turned off for the project.
      - name: SonarQube Cloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1

  # AWS Amplify Hosting builds the app on Node 22 (it rejects Node 24), so prove that the
  # tests and the production build also pass on the Node version Amplify actually uses.
  amplify-node22:
    name: Amplify compatibility (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (no install scripts)
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run tests
        run: npm run test

      - name: Build the app
        run: npm run build
