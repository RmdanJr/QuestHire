sonar.projectKey=RmdanJr_QuestHire
sonar.organization=rmdanjr
sonar.projectName=QuestHire

sonar.sources=src,scripts
sonar.tests=tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.exclusions=src/generated/**

# Written by `npm run test:coverage` (Vitest, V8 provider)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# CLI entry points are thin I/O glue (gh, git, network); their logic lives in unit-tested modules.
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,tests/**,scripts/watch-ci.mjs,scripts/sonar-issues.mjs,scripts/lib/cli.mjs
